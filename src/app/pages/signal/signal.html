<div>
  <input type="number" [(ngModel)]="price">
  Total: {{price() + quantity()}}
  computed total: {{total()}}
  <input type="checkbox" [(ngModel)]="isLight">
</div>
<div>
  <h3>Shopping Cart</h3>
  <p>Cart total: {{cartService.total()}}</p>

  <button (click)="cartService.changePrice(500)">Change price</button>
  <button (click)="cartService.increaseQuantity()">+1</button>
</div>
<div class="signal-page">
  <div class="signal-card">
    <h2 class="signal-title">Signal</h2>

    <div class="count-display">
      <span class="count-label">Count</span>
      <span class="count-value">{{ count() }}</span>
    </div>

    <div class="buttons">
      <button class="btn btn-increment" (click)="increment()">+1</button>
      <button class="btn btn-decrement" (click)="decrement()">−1</button>
      <button class="btn btn-reset" (click)="reset()">Reset</button>
    </div>
  </div>
</div>
