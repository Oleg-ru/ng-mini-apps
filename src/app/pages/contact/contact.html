<div>
  <h3>ℹ️ About</h3>
  <p>About component works</p>
  <button (click)="loadPosts()">Get posts</button>
  <button (click)="createPost()">Add new post</button>
  <div class="posts">

    @if (postResource.isLoading()) {
      <p>Loading posts.</p>
    } @else if (postResource.error()) {
      <p>Failed loading posts</p>
    } @else if (postResource.hasValue()) {
      @for (post of postResource.value(); track post.id) {
        <div class="post-card">
          <span class="post-id">#{{ post.id }}</span>
          <h3 class="post-title">{{ post.title }}</h3>
          <p class="post-body">{{ post.body }}</p>
        </div>
      }
    }
  </div>
</div>
